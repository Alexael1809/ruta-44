openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Current user and role
  - name: catalog
    description: Public and merchant product catalog
  - name: rates
    description: Daily exchange rate
  - name: orders
    description: Customer orders
  - name: payments
    description: Mobile payment submissions
  - name: dashboard
    description: Admin overview
  - name: administration
    description: Master administration settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current signed-in user
      responses:
        "200":
          description: Current user or null when signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get marketplace dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /rates/today:
    get:
      operationId: getTodayRate
      tags: [rates]
      summary: Get today's exchange rate
      responses:
        "200":
          description: Today's rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
        "404":
          description: No rate configured
    post:
      operationId: createExchangeRate
      tags: [rates]
      summary: Set today's exchange rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateInput"
      responses:
        "201":
          description: Rate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRate"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List visible products with pagination and search
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: merchantId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
    post:
      operationId: createProduct
      tags: [catalog]
      summary: Create a product for the current merchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{productId}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get product details
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    patch:
      operationId: updateProduct
      tags: [catalog]
      summary: Update a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [catalog]
      summary: Archive a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204":
          description: Product archived
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders visible to the current user
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Order page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order from a cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List submitted mobile payments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PaymentStatus"
      responses:
        "200":
          description: Payment page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPage"
    post:
      operationId: submitPayment
      tags: [payments]
      summary: Submit a mobile payment for an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "409":
          description: Payment reference already used
  /payment-receiver:
    get:
      operationId: getPaymentReceiver
      tags: [payments]
      summary: Get the active mobile payment receiver
      responses:
        "200":
          description: Active payment receiver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReceiver"
        "404":
          description: Payment receiver not configured
    put:
      operationId: updatePaymentReceiver
      tags: [administration]
      summary: Update the active mobile payment receiver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentReceiverInput"
      responses:
        "200":
          description: Payment receiver updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentReceiver"
  /delivery-locations:
    get:
      operationId: listDeliveryLocations
      tags: [orders]
      summary: List enabled delivery locations
      responses:
        "200":
          description: Enabled delivery locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryLocation"
    post:
      operationId: createDeliveryLocation
      tags: [administration]
      summary: Create a delivery location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryLocationInput"
      responses:
        "201":
          description: Delivery location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryLocation"
  /delivery-locations/{locationId}:
    patch:
      operationId: updateDeliveryLocation
      tags: [administration]
      summary: Enable or disable a delivery location
      parameters:
        - $ref: "#/components/parameters/LocationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryLocationUpdate"
      responses:
        "200":
          description: Delivery location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryLocation"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [administration]
      summary: List users for master administration
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
  /admin/users/{userId}/role:
    patch:
      operationId: updateUserRole
      tags: [administration]
      summary: Change a user's role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: User role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
components:
  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 100
    Category:
      name: category
      in: query
      schema:
        type: string
        maxLength: 60
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        isMaster: { type: boolean }
        merchantId:
          type: ["string", "null"]
      required: [id, email, name, role, isMaster, merchantId]
    UserRole:
      type: string
      enum: [customer, merchant, admin]
    Merchant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        isVisible: { type: boolean }
      required: [id, name, city, isVisible]
    PaymentReceiver:
      type: object
      properties:
        id: { type: string }
        bank: { type: string }
        phone: { type: string }
        identityNumber: { type: string }
        isActive: { type: boolean }
        updatedAt: { type: string, format: date-time }
      required: [id, bank, phone, identityNumber, isActive, updatedAt]
    PaymentReceiverInput:
      type: object
      properties:
        bank: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string, minLength: 7, maxLength: 30 }
        identityNumber: { type: string, minLength: 4, maxLength: 30 }
      required: [bank, phone, identityNumber]
    DeliveryLocation:
      type: object
      properties:
        id: { type: string }
        state: { type: string }
        city: { type: string }
        isEnabled: { type: boolean }
      required: [id, state, city, isEnabled]
    DeliveryLocationInput:
      type: object
      properties:
        state: { type: string, minLength: 2, maxLength: 80 }
        city: { type: string, minLength: 2, maxLength: 80 }
        isEnabled: { type: boolean }
      required: [state, city]
    DeliveryLocationUpdate:
      type: object
      properties:
        isEnabled: { type: boolean }
    AdminUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        isMaster: { type: boolean }
        merchantId: { type: ["string", "null"] }
      required: [id, email, name, role, isMaster, merchantId]
    UserRoleInput:
      type: object
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
        merchantId: { type: ["string", "null"] }
      required: [role]
    Product:
      type: object
      properties:
        id: { type: string }
        merchantId: { type: string }
        merchantName: { type: string }
        name: { type: string }
        sku: { type: string }
        category: { type: string }
        description: { type: string }
        priceUsd: { type: number, format: double }
        stock: { type: integer }
        imageUrl: { type: ["string", "null"] }
        isVisible: { type: boolean }
        condition: { type: string }
      required: [id, merchantId, merchantName, name, sku, category, description, priceUsd, stock, imageUrl, isVisible, condition]
    ProductInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 140 }
        sku: { type: string, minLength: 1, maxLength: 60 }
        category: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
        priceUsd: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: ["string", "null"] }
        isVisible: { type: boolean }
        condition: { type: string, enum: [new, used, refurbished] }
      required: [name, sku, category, description, priceUsd, stock, isVisible, condition]
    ProductUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 140 }
        category: { type: string, minLength: 2, maxLength: 60 }
        description: { type: string, maxLength: 1000 }
        priceUsd: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        imageUrl: { type: ["string", "null"] }
        isVisible: { type: boolean }
        condition: { type: string, enum: [new, used, refurbished] }
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
      required: [items, page, pageSize, total, totalPages]
    ExchangeRate:
      type: object
      properties:
        id: { type: string }
        value: { type: number, minimum: 0 }
        currency: { type: string }
        effectiveDate: { type: string, format: date }
        updatedBy: { type: ["string", "null"] }
      required: [id, value, currency, effectiveDate, updatedBy]
    ExchangeRateInput:
      type: object
      properties:
        value: { type: number, minimum: 0 }
        currency: { type: string, enum: [USD, EUR] }
      required: [value, currency]
    OrderStatus:
      type: string
      enum: [pending_payment, paid, preparing, ready, delivered, cancelled]
    OrderStatusInput:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
      required: [status]
    OrderItemInput:
      type: object
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
      required: [productId, quantity]
    OrderItem:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        productName: { type: string }
        quantity: { type: integer }
        unitPriceUsd: { type: number }
        subtotalUsd: { type: number }
      required: [id, productId, productName, quantity, unitPriceUsd, subtotalUsd]
    OrderInput:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderItemInput" }
        customerName: { type: string, minLength: 2, maxLength: 120 }
        customerPhone: { type: string, minLength: 7, maxLength: 30 }
        deliveryCity: { type: string, minLength: 2, maxLength: 80 }
        pickupNotes: { type: string, maxLength: 500 }
      required: [items, customerName, customerPhone, deliveryCity]
    Order:
      type: object
      properties:
        id: { type: string }
        customerId: { type: ["string", "null"] }
        customerName: { type: string }
        customerPhone: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        totalUsd: { type: number }
        totalBs: { type: number }
        exchangeRate: { type: number }
        deliveryCity: { type: string }
        pickupNotes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
      required: [id, customerId, customerName, customerPhone, status, totalUsd, totalBs, exchangeRate, deliveryCity, pickupNotes, createdAt, items]
    OrderPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
      required: [items, page, pageSize, total, totalPages]
    PaymentStatus:
      type: string
      enum: [pending, approved, rejected]
    PaymentInput:
      type: object
      properties:
        orderId: { type: string }
        bank: { type: string, minLength: 2, maxLength: 80 }
        identityNumber: { type: string, minLength: 4, maxLength: 30 }
        reference: { type: string, minLength: 4, maxLength: 40 }
        phone: { type: string, minLength: 7, maxLength: 30 }
        amountBs: { type: number, minimum: 0 }
      required: [orderId, bank, identityNumber, reference, phone, amountBs]
    Payment:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        bank: { type: string }
        identityNumber: { type: string }
        reference: { type: string }
        phone: { type: string }
        amountBs: { type: number }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        createdAt: { type: string, format: date-time }
      required: [id, orderId, bank, identityNumber, reference, phone, amountBs, status, createdAt]
    PaymentPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
      required: [items, page, pageSize, total, totalPages]
    DashboardSummary:
      type: object
      properties:
        todaySalesUsd: { type: number }
        pendingPayments: { type: integer }
        activeProducts: { type: integer }
        activeMerchants: { type: integer }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        topCategories:
          type: array
          items:
            type: object
            properties:
              category: { type: string }
              count: { type: integer }
            required: [category, count]
      required: [todaySalesUsd, pendingPayments, activeProducts, activeMerchants, recentOrders, topCategories]

